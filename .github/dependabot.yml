version: 2
updates:
  # Every action is pinned to a commit SHA with its version in a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # requirements-dev.txt is locked with hashes from requirements-dev.in:
  # uv pip compile requirements-dev.in --universal --generate-hashes
  #   --python-version 3.12 --no-header -o requirements-dev.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
