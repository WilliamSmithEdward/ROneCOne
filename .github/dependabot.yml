version: 2
updates:
  # Every action is pinned to a commit SHA with its version in a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # .github/requirements holds the hash-locked tools each workflow installs.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, pyvbareference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # requirements-dev.txt locks the local tools (the CI lock plus pywin32)
  # from requirements-dev.in:
  # uv pip compile requirements-dev.in --universal --generate-hashes
  #   --python-version 3.12 -o requirements-dev.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, pyvbareference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The ClamAV engine the malware scan runs, pinned by digest.
  - package-ecosystem: docker
    directory: /.github/security/clamav
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
