name: Release security report

# Each published release gets an olevba and mraptor report on its own assets:
# the runtime and every demo workbook, their SHA-256 hashes, and how their
# results compare with the reviewed baseline at the release tag. The report is
# attached to the release as <tag>-security-report.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to report on, such as v1.10.2
        required: true

permissions:
  contents: write

concurrency:
  group: release-security-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  report:
    name: olevba and mraptor report
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install analysis tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Download the release assets
        run: >-
          gh release download "$TAG" --dir release-assets
          --pattern '*.cls' --pattern '*.xlsm'

      - name: Write the report
        run: >-
          python tools/security_scan.py
          --report "release-assets/$TAG-security-report.md"
          --title "Security report for ROneCOne $TAG"
          release-assets/*.cls release-assets/*.xlsm

      - name: Attach the report to the release
        run: gh release upload "$TAG" "release-assets/$TAG-security-report.md" --clobber
