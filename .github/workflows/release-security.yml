name: Release security report

# Each published release gets an olevba and mraptor report on its own assets:
# the runtime and every demo workbook, their SHA-256 hashes, and how their
# results compare with the reviewed baseline at the release tag. The report is
# attached to the release as <tag>-security-report.md.
#
# Started by hand with a release's tag it is always a dry run: it writes the
# report on that release's assets exactly as a release would, and uploads it
# as the release-preview artifact instead of attaching it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to report on (a dry run), such as v1.10.2
        required: true

permissions:
  contents: write

concurrency:
  group: release-security-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release-report:
    name: Attach release report
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.14'

      - name: Install analysis tooling
        run: python -m pip install --require-hashes -r .github/requirements/security.txt

      - name: Download the release assets
        run: >-
          gh release download "$TAG" --dir release-assets
          --pattern '*.cls' --pattern '*.xlsm'

      - name: Write the report
        run: >-
          python tools/security_scan.py
          --report "release-assets/$TAG-security-report.md"
          --title "Security report for ROneCOne $TAG"
          release-assets/*.cls release-assets/*.xlsm

      - name: Keep what the release would carry
        if: ${{ !cancelled() && github.event_name != 'release' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: "release-assets/${{ env.TAG }}-security-report.md"
          if-no-files-found: error

      - name: Attach the report to the release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" "release-assets/$TAG-security-report.md" --clobber
