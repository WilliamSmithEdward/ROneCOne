name: CI

# The live Excel suite and the demo workbook runs need Microsoft 365 Excel
# driven over COM, which no hosted runner has, so they stay local. Everything
# that reads the sources or the shipped workbooks rather than running them
# belongs here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Contracts and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # requirements-dev.txt pins the versions a local checkout validates
      # against, in one place, reviewed like any other change.
      - name: Install analysis tooling
        run: python -m pip install -r requirements-dev.txt

      # pyVBAanalysis alone runs at its newest release here, so each new rule
      # meets this code as soon as it ships. A release that reports something
      # fails the run even when nothing in this repository changed; the fix is
      # in the code or, for a false positive, in pyVBAanalysis.
      - name: Use the newest pyVBAanalysis
        run: |
          python -m pip install --upgrade pyVBAanalysis
          pyvbaanalysis --version

      # These read the runtime, demo, and tool sources and pin their shapes,
      # and run the security scan's rules on small modules written for them.
      # No Excel.
      - name: Source and demo contracts
        run: python -m unittest discover -s tests/python -v

      # All three folders in one invocation, deliberately. The whole-project
      # checks (late-bound-friend-member, undeclared-variable, unknown-call,
      # member-not-found) need every module present, and a narrower input is
      # treated as a project fragment and skips them silently. Analyzing src
      # alone reports "no diagnostics" on source that a full run rejects.
      #
      # property-accessor-signature-mismatch is ignored because pyVBAanalysis
      # 2.3.0 reports it on the runtime's Item property, a Variant Property Get
      # beside an Object Property Set that the VBE compiles
      # (WilliamSmithEdward/xlide_vscode#152). Drop the flag once a release
      # stops reporting it.
      - name: Static analysis of the sources
        run: >-
          pyvbaanalysis src tests/vba demo/vba
          --no-inline-suppression --ignore property-accessor-signature-mismatch
          --format text

      # The sixteen demo workbooks are what ships, so they meet the same gate.
      # Each one is a whole VBA project on its own, so one invocation per
      # workbook loses no project context, and four at a time finish in about
      # a tenth of the time one invocation over all sixteen takes. xargs exits
      # 123 when any workbook reports a diagnostic. The workbooks keep the last
      # release's modules until the next release repackages them, so a change
      # that makes pyVBAanalysis report on shipped code fails here until then.
      - name: Static analysis of the demo workbooks
        run: >-
          printf '%s\n' demo/*.xlsm
          | xargs -P 4 -n 1 pyvbaanalysis --no-inline-suppression
          --ignore property-accessor-signature-mismatch --format text
