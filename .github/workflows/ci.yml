name: CI

# The live Excel suite and the demo workbook runs need Microsoft 365 Excel
# driven over COM, which no hosted runner has, so they stay local. Everything
# that reads the sources or the shipped workbooks rather than running them
# belongs here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.14'

      # .github/requirements/ci.txt locks the versions a local checkout validates
      # against, in one place, reviewed like any other change.
      - name: Install analysis tooling
        run: python -m pip install --require-hashes -r .github/requirements/ci.txt

      # These read the runtime, demo, and tool sources and pin their shapes,
      # and run the security scan's rules on small modules written for them.
      # No Excel.
      - name: Source and demo contracts
        run: python -m unittest discover -s tests/python -v

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.14'

      # .github/requirements/ci.txt locks pyVBAanalysis with the rest of the
      # tooling;
      # Dependabot proposes each new release.
      - name: Install analysis tooling
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          pyvbaanalysis --version

      # All three folders in one invocation, deliberately. The whole-project
      # checks (late-bound-friend-member, undeclared-variable, unknown-call,
      # member-not-found) need every module present, and a narrower input is
      # treated as a project fragment and skips them silently.
      - name: Static analysis of the sources
        run: >-
          pyvbaanalysis src tests/vba demo/vba
          --no-inline-suppression --format text

      # ROneCOne.cls ships as one file, so it must stand on its own. In the run
      # above, a call from the runtime into a test or demo module resolves.
      # --whole-project analyzes the runtime alone as the complete project it
      # is when a user imports it, and a call like that fails here.
      - name: Static analysis of the runtime on its own
        run: >-
          pyvbaanalysis --whole-project src/ROneCOne.cls
          --no-inline-suppression --format text

      # The sixteen demo workbooks are what ships, so they meet the same gate.
      # Each one is a whole VBA project on its own, so one invocation per
      # workbook loses no project context, and four at a time finish in about
      # a tenth of the time one invocation over all sixteen takes. xargs exits
      # 123 when any workbook reports a diagnostic. The workbooks keep the last
      # release's modules until the next release repackages them, so a change
      # that makes pyVBAanalysis report on shipped code fails here until then.
      - name: Static analysis of the demo workbooks
        run: >-
          printf '%s\n' demo/*.xlsm
          | xargs -P 4 -n 1 pyvbaanalysis --no-inline-suppression --format text

  ci-passed:
    name: CI passed
    if: always()
    needs: [test, static-analysis]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
