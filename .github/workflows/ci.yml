name: CI

# The live Excel suite and the demo workbook runs need Microsoft 365 Excel
# driven over COM, which no hosted runner has, so they stay local. Everything
# that reads source rather than running it belongs here.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Contracts and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # From PyPI, which is the documented install, and pinned so the gate is
      # reproducible. Bumping the analyzer is a deliberate one-line change
      # here, reviewed like any other.
      - name: Install pyVBAanalysis
        run: python -m pip install pyvbaanalysis==1.3.0

      # Pure stdlib: these read the runtime, demo, and tool sources and pin
      # their shapes. No Excel, no third-party runtime dependency.
      - name: Source and demo contracts
        run: python -m unittest discover -s tests/python -v

      # All three folders in one invocation, deliberately. The whole-project
      # checks (late-bound-friend-member, undeclared-variable, unknown-call,
      # member-not-found) need every module present, and a narrower input is
      # treated as a project fragment and skips them silently. Analyzing src
      # alone reports "no diagnostics" on source that a full run rejects.
      - name: Static analysis
        run: >-
          pyvbaanalysis src tests/vba demo/vba
          --no-inline-suppression --format text

  workbooks:
    # Every workbook embeds the whole runtime, so this is sixteen
    # whole-project analyses at about 30 seconds each. Eight minutes is too
    # slow to sit on every push for what it adds: the VBA inside is the source
    # the job above already analyzed, and the packager verifies byte-for-byte
    # that each injected module round-tripped. It earns its keep on a tag,
    # where it checks the artifacts that actually ship.
    name: Shipped workbooks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pyVBAanalysis
        run: python -m pip install pyvbaanalysis==1.3.0

      # The analyzer reads the VBA project straight out of an .xlsm. The live
      # test workbook is not committed, so it stays a local check.
      - name: Static analysis of every shipped workbook
        run: >-
          pyvbaanalysis demo/*.xlsm
          --no-inline-suppression --format text
