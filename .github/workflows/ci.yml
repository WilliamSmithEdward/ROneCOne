name: CI

# The live Excel suite and the demo workbook runs need Microsoft 365 Excel
# driven over COM, which no hosted runner has, so they stay local. Everything
# that reads source rather than running it belongs here, and between them the
# two steps below cover the whole static half of the release battery.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Contracts and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned so the gate is reproducible. Bumping the analyzer is a
      # deliberate one-line change here, reviewed like any other.
      - name: Install pyVBAanalysis
        run: >-
          python -m pip install --upgrade
          "git+https://github.com/WilliamSmithEdward/pyVBAanalysis@v1.3.0"

      # Pure stdlib: these read the runtime, demo, and tool sources and pin
      # their shapes. No Excel, no third-party runtime dependency.
      - name: Source and demo contracts
        run: python -m unittest discover -s tests/python -v

      - name: Static analysis
        run: pyvbaanalysis src tests/vba demo/vba
