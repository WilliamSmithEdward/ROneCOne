name: Security

# olevba and MacroRaptor (mraptor) report what the shipped VBA could do. The
# runtime reads files, runs processes, and calls native code by design, so the
# scan holds each shipped file's olevba findings and mraptor flags to
# tools/security_baseline.json and fails on any change in either direction, on
# code that runs on its own, and on P-code that its source does not explain.
# The release report lives in release-security.yml, the one workflow that needs
# write access. ClamAV and YARA-X run in malware-scan.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macros:
    name: olevba and mraptor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.14'

      - name: Install analysis tooling
        run: python -m pip install --require-hashes -r .github/requirements/security.txt

      - name: Scan the runtime and the demo workbooks
        run: python tools/security_scan.py

  security-passed:
    name: Security passed
    if: always()
    needs: [macros]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every security job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
