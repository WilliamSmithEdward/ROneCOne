name: Security

# olevba and MacroRaptor (mraptor) report what the shipped VBA could do. The
# runtime reads files, runs processes, and calls native code by design, so the
# scan holds each shipped file's olevba findings and mraptor flags to
# tools/security_baseline.json and fails on any change in either direction, on
# code that runs on its own, and on P-code that its source does not explain.
# The release report lives in release-security.yml, the one workflow that needs
# write access.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: olevba and mraptor against the reviewed baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install analysis tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Scan the runtime and the demo workbooks
        run: python tools/security_scan.py

  malware:
    name: ClamAV and YARA-X on shipped artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install scanners
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          python -m pip install -r requirements-dev.txt

      - name: Download reviewed public rules
        run: python tools/yara_forge_rules.py download yara-forge-rules-core.zip

      - name: Scan shipped artifacts
        run: python tools/malware_scan.py yara-forge-rules-core.zip
